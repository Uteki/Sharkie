<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="icon" type="image/x-icon" href="assets/global/sharkicon.png">
    <link rel="stylesheet" href="style.css">

    <script src="./script.js"></script>

    <script src="./classes/world.class.js"></script>
    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/moveable-object.class.js"></script>

    <script src="./classes/melee-zone.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>

    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/character.class.js"></script>

    <script src="./classes/you-win.class.js"></script>
    <script src="./classes/game-over.class.js"></script>
    <script src="./classes/try-again.class.js"></script>

    <script src="./classes/fullscreen.class.js"></script>

    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/foe.class.js"></script>
    <script src="./classes/foe2.class.js"></script>
    <script src="./classes/endboss.class.js"></script>

    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bubble.class.js"></script>
    <script src="./classes/music-controller.class.js"></script>

    <script src="./scripts/music.js"></script>
    <script src="./scripts/game.js"></script>
    <script src="scripts/levels/level1.js"></script>

    <title>Sharkie Game</title>
</head>
<body onload="init()">

<h1>Sharkie</h1>

<canvas width="720" height="480">
</canvas>

<div class="overlay">
    <div id="hud">
        <div class="panel">
            <!-- Sound / Fullscreen ? -->
        </div>
        <div id="controls" class="panel d-none">
            <div class="panel-wrapper dpad">
                <button id="btnUp" class="control-btn">▲</button>
                <div class="dpad-middle-row">
                    <button id="btnLeft" class="control-btn">◄</button>
                    <button id="btnDown" class="control-btn">▼</button>
                    <button id="btnRight" class="control-btn">►</button>
                </div>
            </div>

            <div class="panel-wrapper attack-pad">
                <button id="btnAtk" class="attack-btn">D</button>
            </div>
        </div>
    </div>
</div>

<div id="rotate-overlay">
    <img src="assets/global/png/rotate.png" alt="Rotate Icon">
    <p>Please rotate your device to landscape mode</p>
</div>

</body>
</html>
